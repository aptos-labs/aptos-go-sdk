name: "Code Coverage"

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

env:
  GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  coverage:
    name: Generate Coverage Report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.GIT_SHA }}

      # Coverage is the only CI job that compiles inside v2/. The rest of
      # CI (lint, vet, unit tests) operates on v1 only and goes through
      # mise. Here we skip mise so coverage gets one full Go install
      # (with the complete cmd/ tree, including `covdata` — needed for
      # `go test -coverprofile` on the v2/examples/* package-mains that
      # have no test files). go-version-file follows v2/go.mod, including
      # its `toolchain` pin (currently go1.27.1).
      - name: Set up Go (pinned to v2/go.mod)
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: v2/go.mod
          cache: true

      - name: Download FFI static library (v1.1.2 pre-built, no Rust toolchain needed)
        working-directory: v2
        run: go run github.com/aptos-labs/confidential-asset-bindings/bindings/go/aptosconfidential/tools/download@v1.1.2

      - name: Run v2 SDK tests with coverage
        working-directory: v2
        env:
          CGO_ENABLED: "1"
          CGO_LDFLAGS: "-L${{ github.workspace }}/v2/native/x86_64-unknown-linux-gnu"
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic ./...

      # Run v1 SDK tests with coverage (optional, for overall repo coverage).
      # v1 and v2 now share `go 1.26.0` / `toolchain go1.27.1`, so the Go
      # installed above is compatible with both modules.
      - name: Run v1 SDK tests with coverage
        run: |
          go test -race -coverprofile=coverage-v1.out -covermode=atomic ./...
        continue-on-error: true  # Don't fail if v1 tests need localnet

      # Upload v2 coverage to Codecov
      - name: Upload v2 coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: ./v2/coverage.out
          flags: v2
          name: v2-sdk
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      # Upload v1 coverage to Codecov (if available)
      - name: Upload v1 coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        if: hashFiles('coverage-v1.out') != ''
        with:
          files: ./coverage-v1.out
          flags: v1
          name: v1-sdk
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
